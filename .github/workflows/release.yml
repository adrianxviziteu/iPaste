name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release archive
        run: ./Scripts/package-release.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Every release carries the install note: this build is not notarized,
          # so macOS refuses it until the quarantine flag is cleared.
          body: |
            ### Install

            1. Unzip and move `iPaste.app` to `/Applications`.
            2. macOS will refuse to open it - this build is not notarized.
               Right-click the app and choose **Open**, then confirm. Or run:

               ```
               xattr -dr com.apple.quarantine /Applications/iPaste.app
               ```

            3. Grant Accessibility access when the first-run guide asks, so
               iPaste can paste into the app you are using.
          files: |
            dist/iPaste.zip
            dist/iPaste.zip.sha256
